<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#faf8f3;font-family:Arial,Helvetica,sans-serif;color:#1e2422">
    <table role="presentation" width="100%" style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e4dfd3;border-radius:12px">
      <tr><td style="padding:28px">
        <p style="margin:0 0 4px;color:#1f4d3a;font-size:18px;font-weight:bold">Avanilands</p>
        <h1 style="margin:16px 0 8px;font-size:20px">Your sign-in code</h1>
        <p style="margin:0 0 16px;line-height:1.5">Enter this code on the website to sign in:</p>
        <p style="margin:0 0 24px;font-size:32px;font-weight:bold;letter-spacing:8px;color:#1f4d3a">{{ .Token }}</p>
        <p style="margin:0;color:#5b6770;font-size:13px;line-height:1.5">The code works once and expires in 1 hour. If you didn't ask to sign in, ignore this email — nobody can sign in without the code. We will never ask you for this code by phone or WhatsApp.</p>
      </td></tr>
    </table>
  </body>
</html>
